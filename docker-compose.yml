services:
  customer_db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - customer_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  customer_backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: "Otel Rezervasyon API (Müşteri)"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://${PUBLIC_HOST}:${PUBLIC_PORT}
      APP_TIMEZONE: UTC
      LOG_CHANNEL: stack
      LOG_LEVEL: error

      DB_CONNECTION: mysql
      DB_HOST: customer_db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local

      FRONTEND_URL: http://${PUBLIC_HOST}:${PUBLIC_PORT}

      DB_SEED_ON_BOOT: ${DB_SEED_ON_BOOT:-false}
    depends_on:
      customer_db:
        condition: service_healthy

  customer_frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST}:${PUBLIC_PORT}/api
    restart: unless-stopped
    depends_on:
      - customer_backend

  customer_proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "4007:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - customer_frontend
      - customer_backend

volumes:
  customer_db_data:
