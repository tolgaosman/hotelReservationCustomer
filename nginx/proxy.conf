# Docker'ın iç DNS'i: upstream'leri değişken üzerinden çözerek backend/frontend
# yeniden oluşturulduğunda (IP değiştiğinde) 502'ye düşmeyi ve nginx'in
# upstream yokken hiç açılmamasını engeller.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    set $backend_upstream http://customer_backend;
    set $frontend_upstream http://customer_frontend:3000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /up {
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
